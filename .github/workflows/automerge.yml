name: Merge me test dependencies!

on:
  workflow_run:
    types:
      - completed
    workflows:
      - 'Run tests'
      - 'Test build package'
      - 'Run pre-commit'
      - 'Run test commands'
  check_suite:
    types:
      - completed

jobs:
  automerge:
    uses: fizyk/actions-reuse/.github/workflows/shared-automerge.yml@c76d10cf9448b3a9afdbef29e727e0fd00b2f544 # v5.2.8
    secrets:
      client_id: ${{ secrets.MERGE_APP_CLIENT_ID }}
      private_key: ${{ secrets.MERGE_APP_PRIVATE_KEY }}
